<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Carousel</title>
    <link rel="stylesheet" href="styles.css">  
</head>

<body>
    <h1 class="about-title">OUR TEAM</h1>

    <div class="carousel-container">
        <button class="nav-arrow left">‹</button>
        <div class="carousel-track">
            <div class="card" data-index="0">
                <img src="https://media.istockphoto.com/id/2202380548/ru/фото/уверенная-в-себе-женщина-улыбается-в-повседневном-наряде-на-белом-фоне.jpg?s=612x612&w=0&k=20&c=TQk6B38H5U7H8ve5_Rcd-bkzF7oAlG9HvlhiQHUGS2E="
                    alt="Team Member 1">
            </div>
            <div class="card" data-index="1">
                <img src="https://img.magnific.com/premium-photo/portrait-young-man-holding-stethoscope-against-white-background_1048944-20819206.jpg?semt=ais_hybrid&w=740"
                    alt="Team Member 2">
            </div>
            <div class="card" data-index="2">
                <img src="https://img.magnific.com/fotos-premium/cerca-mujer-joven-sonriendo-vistiendo-camiseta-blanca-sobre-fondo-blanco_719646-2642.jpg"
                    alt="Team Member 3">
            </div>
            <div class="card" data-index="3">
                <img src="https://thumbs.dreamstime.com/b/portrait-young-woman-classic-positive-mood-beautiful-model-posing-studio-over-plain-background-looking-camera-220935529.jpg"
                    alt="Team Member 4">
            </div>
            <div class="card" data-index="4">
                <img src="https://avatars.mds.yandex.net/i?id=e9a93f06c5bd06b95adc5e770124e66842dabbfc-5205837-images-thumbs&n=13"
                    alt="Team Member 5">
            </div>
            <div class="card" data-index="5">
                <img src="https://aperahealthgroup.com/wp-content/uploads/2024/07/WhatsApp-Image-2024-07-01-at-15.31.21-1.jpeg"
                    alt="Team Member 6">
            </div>
        </div>
        <button class="nav-arrow right">›</button>
    </div>

    <div class="member-info">
        <h2 class="member-name">David Kim</h2>
        <p class="member-role">Founder</p>
    </div>

    <div class="dots">
        <div class="dot active" data-index="0"></div>
        <div class="dot" data-index="1"></div>
        <div class="dot" data-index="2"></div>
        <div class="dot" data-index="3"></div>
        <div class="dot" data-index="4"></div>
        <div class="dot" data-index="5"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
